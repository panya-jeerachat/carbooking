<!DOCTYPE html>
<html lang="th">
<head>
  <title>รับงานขับรถ | EN-MSU Fleet</title>
  <link rel="icon" href="logo.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#F9BE02;--gold-deep:#C59701;--gold-soft:#FFF4CC;--graphite:#454545;--maroon:#401D1B;--paper:#F2F2F0;--line:#E2E1DD;--ok:#1F7A3F;--bad:#9B1C1C}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:'Sarabun',Tahoma,sans-serif;background:var(--paper);color:#262423;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px}
    .card{width:100%;max-width:520px;background:#fff;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 40px -24px rgba(64,29,27,.45)}
    .top{position:relative;background:var(--graphite);padding:18px 20px;border-bottom:6px solid var(--gold);overflow:hidden}
    .top::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.22) 2px,transparent 2.4px);background-size:14px 14px;-webkit-mask-image:linear-gradient(110deg,#000,transparent 65%);mask-image:linear-gradient(110deg,#000,transparent 65%)}
    .logo{position:relative;background:#fff;border-radius:12px;padding:8px 10px;display:block;width:220px}
    .logo img{width:100%;display:block}
    .body{padding:22px}
    h1{font-family:'Prompt',sans-serif;color:var(--maroon);font-size:22px;margin:0 0 6px}
    .sub{color:#76716D;margin:0 0 18px}
    dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0 0 22px;font-size:15.5px}
    dt{color:#76716D} dd{margin:0}
    .when{font-family:'Prompt',sans-serif;font-size:19px;color:var(--maroon);background:var(--gold-soft);border-radius:12px;padding:12px 14px;margin-bottom:18px}
    .btn{width:100%;border:0;border-radius:999px;padding:16px;font-family:'Prompt',sans-serif;font-size:18px;font-weight:600;cursor:pointer;background:var(--maroon);color:var(--gold)}
    .btn[disabled]{opacity:.6}
    .btn.ghost{background:#fff;color:#646464;border:1.5px solid #E2E1DD;font-size:15px;padding:12px}
    .btn.bad{background:#9B1C1C;color:#fff;font-size:15px;padding:12px}
    .btn.ok{background:#1F7A3F;color:#fff}
    .btn.pulse{box-shadow:0 0 0 4px rgba(31,122,63,.25)}
    .ap-tl{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
    .ap-st{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 10px;border-radius:10px;background:#F6F5F2}
    .ap-st span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#ddd;color:#555;font-weight:700;flex:none}
    .ap-st small{display:block;color:#76716D}
    .ap-st.DONE span{background:#1F7A3F;color:#fff} .ap-st.CURRENT{background:#EEEAFB} .ap-st.CURRENT span{background:#6D5BD0;color:#fff} .ap-st.REJECTED span{background:#9B1C1C;color:#fff}
    .atts{display:flex;flex-direction:column;gap:6px;margin:-8px 0 18px;padding:10px 12px;background:#F6F5F2;border-radius:12px}
    .atts b{font-family:'Prompt',sans-serif;color:#401D1B;font-size:14px}
    .atts a{color:#2D5B8A;word-break:break-word}
    .msg{border-radius:14px;padding:16px;font-family:'Prompt',sans-serif;font-size:17px;text-align:center}
    .msg.ok{background:#E2F3E7;color:var(--ok)} .msg.bad{background:#FBE6E4;color:var(--bad)} .msg.info{background:var(--gold-soft);color:#7A5A00}
    .carimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin-bottom:14px;display:block;background:#eee}
    .home-link{display:inline-block;margin-top:8px;color:var(--maroon);font-family:'Prompt',sans-serif}
    .foot{font-size:12.5px;color:#999;text-align:center;padding:0 20px 18px}
  </style>
</head>
<body>
  <div class="card">
    <div class="top"><span class="logo"><img id="logo" alt="คณะวิศวกรรมศาสตร์ มหาวิทยาลัยมหาสารคาม"></span></div>
    <div class="body" id="body"></div>
    <div class="foot">ระบบจองรถยนต์และพนักงานขับรถ • คณะวิศวกรรมศาสตร์ มหาวิทยาลัยมหาสารคาม<br><a class="home-link" href="index.html" target="_top">⌂ กลับหน้าหลัก</a></div>
  </div>

<script src="config.js"></script>
<script>
  document.getElementById('logo').src = 'logo.png';
  const CFG = window.FLEET_CONFIG || {};
  const TOKEN = new URLSearchParams(location.search).get('t') || '';
  let INFO = null;
  // เรียก API แบบไม่ส่งคุกกี้ Google -> ไม่ติดปัญหาหลายบัญชี
  function api(fn, args) {
    return fetch(CFG.API_URL, { method: 'POST', credentials: 'omit', cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
  }
  const TH = { INTERNAL: 'ภายใน', EXTERNAL: 'ภายนอก' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = ms => new Date(ms).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok', weekday: 'short', day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' น.';
  const body = document.getElementById('body');

  // เรียกเซิร์ฟเวอร์ (บน Apps Script ใช้ช่องทางของ Google / บนเว็บคณะ accept.html ใช้ fetch)
  function run(fn, args) {
    return api(fn, args);
  }
  const errText = e => String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '');
  const ACTION = (location.search.match(/[?&]a=(\w+)/) || [])[1] || '';
  const attHtml = b => (b.attachments && b.attachments.length) ? '<div class="atts"><b>เอกสารแนบ (' + b.attachments.length + ')</b>' +
    b.attachments.map(a => '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + (a.type === 'pdf' ? '📄 ' : '🖼 ') + esc(a.name) + '</a>').join('') + '</div>' : '';
  /* ---------- หน้าพิจารณาของผู้อนุมัติ (ลิงก์จากอีเมล) ---------- */
  function renderApprove() {
    const b = INFO.booking, tl = INFO.timeline;
    const steps = tl ? tl.steps.map(st => '<div class="ap-st ' + st.state + '"><span>' + st.no + '</span><div><b>' + esc(st.name) + '</b>' +
      (st.log ? '<small>' + (st.log.action === 'REJECT' ? 'ไม่อนุมัติ' : st.log.action === 'SKIP' ? 'ข้าม' : 'อนุมัติ') + ' • ' + esc(st.log.name) + '</small>' : st.state === 'CURRENT' ? '<small>รอพิจารณา</small>' : '') + '</div></div>').join('') : '';
    let html = '<h1>พิจารณาคำขอใช้รถ</h1><p class="sub">' + esc(INFO.approverName) + ' • ขั้นที่ ' + INFO.step + (tl ? '/' + tl.total : '') + ' • เลขที่ ' + esc(b.id) + '</p>' +
      (steps ? '<div class="ap-tl">' + steps + '</div>' : '') +
      (b.carPhoto ? '<img class="carimg" src="' + esc(b.carPhoto) + '" alt="" onerror="this.remove()">' : '') +
      '<div class="when">' + fmt(b.start) + '<br>ถึง ' + fmt(b.end) + '</div>' +
      '<dl><dt>ผู้ขอ</dt><dd><b>' + esc(b.requesterName) + '</b>' + (b.requesterPosition ? ' • ' + esc(b.requesterPosition) : '') + '</dd><dt>หน่วยงาน</dt><dd>' + esc(b.department || '-') + '</dd>' +
      '<dt>สถานที่ไป</dt><dd><b>' + esc(b.destination) + '</b></dd><dt>วัตถุประสงค์</dt><dd>' + esc(b.purpose) + '</dd>' +
      '<dt>ภารกิจ</dt><dd>' + esc(TH[b.missionType] || b.missionType) + '</dd><dt>ผู้โดยสาร</dt><dd>' + esc(b.passengers) + ' คน</dd>' +
      '<dt>รถ</dt><dd>' + esc(b.carPlate || 'ยังไม่ระบุ') + '</dd><dt>คนขับ</dt><dd>' + (b.noDriver ? 'ไม่ใช้พนักงานขับรถ' : esc(b.driverName || 'ยังไม่มีผู้รับงาน')) + '</dd></dl>' + attHtml(b);
    if (INFO.state === 'OPEN') {
      html += '<div id="acts"><textarea id="note" placeholder="ความเห็น (ไม่บังคับสำหรับการอนุมัติ / จำเป็นเมื่อไม่อนุมัติ)" style="width:100%;min-height:64px;border:1.5px solid #E2E1DD;border-radius:12px;padding:10px;font:inherit;margin-bottom:10px"></textarea>' +
        '<button class="btn ok" id="ap">✓ อนุมัติขั้นที่ ' + INFO.step + '</button>' +
        '<button class="btn bad" id="rj" style="margin-top:8px">✕ ไม่อนุมัติ</button></div>';
    } else html += '<div class="msg info">' + esc(INFO.message) + '</div>';
    body.innerHTML = html;
    const acts = document.getElementById('acts');
    if (!acts) return;
    if (ACTION === 'reject') document.getElementById('note').focus();
    if (ACTION === 'approve') document.getElementById('ap').classList.add('pulse');
    const doIt = (fn, needNote) => {
      const note = document.getElementById('note').value.trim();
      if (needNote && !note) { document.getElementById('note').focus(); document.getElementById('note').style.borderColor = '#9B1C1C'; return; }
      acts.querySelectorAll('button').forEach(x => x.disabled = true);
      run(fn, [TOKEN, note]).then(r => { acts.innerHTML = '<div class="msg ' + (fn === 'approveByToken' ? 'ok' : 'info') + '">' + esc(r.message) + '</div>'; })
        .catch(e => { acts.innerHTML = '<div class="msg bad">' + esc(errText(e)) + '</div>'; });
    };
    document.getElementById('ap').onclick = () => doIt('approveByToken', false);
    document.getElementById('rj').onclick = () => doIt('rejectByToken', true);
  }

  function render() {
    if (!INFO.ok) { body.innerHTML = '<div class="msg bad">' + esc(INFO.message) + '</div>'; return; }
    if (INFO.kind === 'approve') return renderApprove();
    const b = INFO.booking;
    let html = '<h1>' + (INFO.state === 'OPEN' ? 'งานขับรถใหม่สำหรับคุณ' : 'รายละเอียดงาน') + '</h1>' +
      '<p class="sub">คุณ' + esc(INFO.driverName) + ' • เลขที่ ' + esc(b.id) + (b.status === 'PENDING_APPROVAL' ? ' • <b style="color:#401D1B">รออนุมัติ</b>' : '') + '</p>' +
      (b.carPhoto ? '<img class="carimg" src="' + esc(b.carPhoto) + '" alt="" onerror="this.remove()">' : '') +
      '<div class="when">' + fmt(b.start) + '<br>ถึง ' + fmt(b.end) + '</div>' +
      '<dl><dt>สถานที่ไป</dt><dd><b>' + esc(b.destination) + '</b></dd><dt>ภารกิจ</dt><dd>' + esc(TH[b.missionType] || b.missionType) + '</dd>' +
      '<dt>วัตถุประสงค์</dt><dd>' + esc(b.purpose) + '</dd><dt>รถ</dt><dd>' + esc(b.carPlate || 'รอเจ้าหน้าที่จัดรถ') + '</dd>' +
      '<dt>ผู้จอง</dt><dd>' + esc(b.requesterName) + (b.department ? ' • ' + esc(b.department) : '') + (b.requesterPhone ? ' • ' + esc(b.requesterPhone) : '') + '</dd>' +
      '<dt>ผู้โดยสาร</dt><dd>' + esc(b.passengers) + ' คน</dd></dl>' + attHtml(b);
    if (INFO.state === 'OPEN') {
      html += '<div id="acts"><button class="btn" id="go">✋ รับงานนี้</button>' +
        '<p class="sub" style="text-align:center;margin:10px 0 14px;font-size:13px">' + (b.approved ? 'กดรับแล้วงานจะยืนยันทันที' : 'กดรับแล้วสถานะเป็น "รออนุมัติ" และระบบกันเวลาของคุณไว้ให้งานนี้') + ' • คนที่กดรับก่อนได้งาน</p>' +
        '<button class="btn ghost" id="no">ไม่สะดวกรับงานนี้</button>' +
        '<div id="noBox" style="display:none;margin-top:12px"><textarea id="why" placeholder="เหตุผล (ไม่บังคับ) เช่น ติดธุระ/ลา" style="width:100%;min-height:70px;border:1.5px solid #E2E1DD;border-radius:12px;padding:10px;font:inherit"></textarea>' +
        '<button class="btn bad" id="noOk" style="margin-top:8px">ยืนยันไม่สะดวก</button></div></div>';
    } else html += '<div class="msg ' + (INFO.state === 'MINE' ? 'ok' : 'info') + '">' + esc(INFO.message) + '</div>';
    body.innerHTML = html;
    const go = document.getElementById('go'), acts = document.getElementById('acts');
    if (go) go.onclick = () => {
      go.disabled = true; go.textContent = 'กำลังบันทึก…';
      run('acceptJobByToken', [TOKEN]).then(r => { acts.innerHTML = '<div class="msg ok">✔ ' + esc(r.message) + '</div>'; })
        .catch(e => { acts.innerHTML = '<div class="msg bad">' + esc(errText(e)) + '</div>'; });
    };
    const no = document.getElementById('no');
    if (no) {
      const open = () => { document.getElementById('noBox').style.display = 'block'; no.style.display = 'none'; document.getElementById('why').focus(); };
      no.onclick = open;
      if (ACTION === 'decline') open();
      document.getElementById('noOk').onclick = () => {
        const btn = document.getElementById('noOk'); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
        run('declineJobByToken', [TOKEN, document.getElementById('why').value]).then(r => { acts.innerHTML = '<div class="msg info">' + esc(r.message) + '</div>'; })
          .catch(e => { acts.innerHTML = '<div class="msg bad">' + esc(errText(e)) + '</div>'; });
      };
    }
  }
  body.innerHTML = '<p class="sub" style="text-align:center">กำลังโหลดข้อมูลงาน…</p>';
  if (!TOKEN) { INFO = { ok: false, message: 'ลิงก์ไม่ครบ กรุณาเปิดจากปุ่มในอีเมลอีกครั้ง' }; render(); }
  else api('getInvitePreview', [TOKEN]).then(d => { INFO = d; render(); })
    .catch(() => { INFO = { ok: false, message: 'เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่อีกครั้ง' }; render(); });
</script>
</body>
</html>
