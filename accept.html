<!DOCTYPE html>
<html lang="th">
<head>
  <title>รับงานขับรถ | EN-MSU Fleet</title>
  <link rel="icon" href="logo.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#F9BE02;--gold-deep:#C59701;--gold-soft:#FFF4CC;--graphite:#454545;--maroon:#401D1B;--paper:#F2F2F0;--line:#E2E1DD;--ok:#1F7A3F;--bad:#9B1C1C}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:'Sarabun',Tahoma,sans-serif;background:var(--paper);color:#262423;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px}
    .card{width:100%;max-width:520px;background:#fff;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 40px -24px rgba(64,29,27,.45)}
    .top{position:relative;background:var(--graphite);padding:18px 20px;border-bottom:6px solid var(--gold);overflow:hidden}
    .top::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.22) 2px,transparent 2.4px);background-size:14px 14px;-webkit-mask-image:linear-gradient(110deg,#000,transparent 65%);mask-image:linear-gradient(110deg,#000,transparent 65%)}
    .logo{position:relative;background:#fff;border-radius:12px;padding:8px 10px;display:block;width:220px}
    .logo img{width:100%;display:block}
    .body{padding:22px}
    h1{font-family:'Prompt',sans-serif;color:var(--maroon);font-size:22px;margin:0 0 6px}
    .sub{color:#76716D;margin:0 0 18px}
    dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0 0 22px;font-size:15.5px}
    dt{color:#76716D} dd{margin:0}
    .when{font-family:'Prompt',sans-serif;font-size:19px;color:var(--maroon);background:var(--gold-soft);border-radius:12px;padding:12px 14px;margin-bottom:18px}
    .btn{width:100%;border:0;border-radius:999px;padding:16px;font-family:'Prompt',sans-serif;font-size:18px;font-weight:600;cursor:pointer;background:var(--maroon);color:var(--gold)}
    .btn[disabled]{opacity:.6}
    .msg{border-radius:14px;padding:16px;font-family:'Prompt',sans-serif;font-size:17px;text-align:center}
    .msg.ok{background:#E2F3E7;color:var(--ok)} .msg.bad{background:#FBE6E4;color:var(--bad)} .msg.info{background:var(--gold-soft);color:#7A5A00}
    .carimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin-bottom:14px;display:block;background:#eee}
    .foot{font-size:12.5px;color:#999;text-align:center;padding:0 20px 18px}
  </style>
</head>
<body>
  <div class="card">
    <div class="top"><span class="logo"><img id="logo" alt="คณะวิศวกรรมศาสตร์ มหาวิทยาลัยมหาสารคาม"></span></div>
    <div class="body" id="body"></div>
    <div class="foot">ระบบจองรถยนต์และพนักงานขับรถ • คณะวิศวกรรมศาสตร์ มหาวิทยาลัยมหาสารคาม</div>
  </div>

<script src="config.js"></script>
<script>
  document.getElementById('logo').src = 'logo.png';
  const CFG = window.FLEET_CONFIG || {};
  const TOKEN = new URLSearchParams(location.search).get('t') || '';
  let INFO = null;
  // เรียก API แบบไม่ส่งคุกกี้ Google -> ไม่ติดปัญหาหลายบัญชี
  function api(fn, args) {
    return fetch(CFG.API_URL, { method: 'POST', credentials: 'omit', cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
  }
  const TH = { INTERNAL: 'ภายใน', EXTERNAL: 'ภายนอก' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = ms => new Date(ms).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok', weekday: 'short', day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' น.';
  const body = document.getElementById('body');

  function render() {
    if (!INFO.ok) { body.innerHTML = '<div class="msg bad">' + esc(INFO.message) + '</div>'; return; }
    const b = INFO.booking;
    let html = '<h1>' + (INFO.state === 'OPEN' ? 'ยืนยันรับงานขับรถ' : 'รายละเอียดงาน') + '</h1>' +
      '<p class="sub">คุณ' + esc(INFO.driverName) + ' • เลขที่ ' + esc(b.id) + '</p>' +
      (b.carPhoto ? '<img class="carimg" src="' + esc(b.carPhoto) + '" alt="" onerror="this.remove()">' : '') +
      '<div class="when">' + fmt(b.start) + '<br>ถึง ' + fmt(b.end) + '</div>' +
      '<dl><dt>สถานที่ไป</dt><dd><b>' + esc(b.destination) + '</b></dd><dt>ภารกิจ</dt><dd>' + esc(TH[b.missionType] || b.missionType) + '</dd>' +
      '<dt>วัตถุประสงค์</dt><dd>' + esc(b.purpose) + '</dd><dt>รถ</dt><dd>' + esc(b.carPlate) + '</dd>' +
      '<dt>ผู้จอง</dt><dd>' + esc(b.requesterName) + (b.requesterPhone ? ' • ' + esc(b.requesterPhone) : '') + '</dd>' +
      '<dt>ผู้โดยสาร</dt><dd>' + esc(b.passengers) + ' คน</dd></dl>';
    if (INFO.state === 'OPEN') html += '<button class="btn" id="go">✋ ยืนยันรับงานนี้</button><p class="sub" style="text-align:center;margin:10px 0 0;font-size:13px">คนขับที่ยืนยันก่อนจะได้งาน</p>';
    else html += '<div class="msg ' + (INFO.state === 'MINE' ? 'ok' : 'info') + '">' + esc(INFO.message) + '</div>';
    body.innerHTML = html;
    const go = document.getElementById('go');
    if (go) go.onclick = () => {
      go.disabled = true; go.textContent = 'กำลังบันทึก…';
      api('acceptJobByToken', [TOKEN])
        .then(r => { go.outerHTML = '<div class="msg ok">✔ ' + esc(r.message) + '</div>'; })
        .catch(e => { go.outerHTML = '<div class="msg bad">' + esc(String(e.message || e).replace(/^(Exception|Error):\s*/, '')) + '</div>'; });
    };
  }
  body.innerHTML = '<p class="sub" style="text-align:center">กำลังโหลดข้อมูลงาน…</p>';
  if (!TOKEN) { INFO = { ok: false, message: 'ลิงก์ไม่ครบ กรุณาเปิดจากปุ่มในอีเมลอีกครั้ง' }; render(); }
  else api('getInvitePreview', [TOKEN]).then(d => { INFO = d; render(); })
    .catch(() => { INFO = { ok: false, message: 'เชื่อมต่อระบบไม่ได้ กรุณาลองใหม่อีกครั้ง' }; render(); });
</script>
</body>
</html>
